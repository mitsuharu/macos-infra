name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 1 1 * *'

permissions:
  contents: read

jobs:
  validate:
    name: Validate setup files
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)
          zsh -n dotfiles/.zprofile

      - name: Check Brewfile syntax
        run: ruby -c shells/Brewfile

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD || git diff --check
