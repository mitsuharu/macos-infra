name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # 毎月1日 11:17 JST（UTC 02:17）。毎時0分に実行が集中しやすいため17分にずらす。
    - cron: '17 2 1 * *'

permissions:
  contents: read

jobs:
  validate:
    name: Validate setup files
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record macOS runner environment
        shell: bash
        run: |
          echo "## macOS runner environment" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sw_vers | tee -a "$GITHUB_STEP_SUMMARY"
          uname -m | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)
          zsh -n dotfiles/.zprofile

      - name: Audit shell scripts with ShellCheck
        shell: bash
        run: |
          set -uo pipefail
          brew install shellcheck
          echo "## ShellCheck の検出結果（既存コードの監査）" >> "$GITHUB_STEP_SUMMARY"
          echo '絞り込みなしで全シェルスクリプトを検査します。既存コードの修正が済むまで、このステップは失敗扱いにしません。' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          set +e
          find . -type f -name '*.sh' -print0 |
            xargs -0 shellcheck --format=gcc 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          result="${PIPESTATUS[1]}"
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$result" -ne 0 ]]; then
            echo "::warning::ShellCheck で既存の問題を検出しました。結果はジョブのサマリーを確認してください。"
          fi

      - name: Test setup entrypoint safety
        shell: bash
        run: bash tests/setup_safety.sh

      - name: Check Brewfile syntax
        run: ruby -c shells/Brewfile

      - name: Check whitespace
        run: git diff --check
